version: '3.9'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: market-timescaledb
    environment:
      POSTGRES_DB: market_analytics
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Market@2026}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./scripts/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./queries:/queries:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d market_analytics"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - market-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: market-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@market.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin@2026}
    ports:
      - "8080:80"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - market-network
    restart: unless-stopped

volumes:
  timescale_data:

networks:
  market-network:
    driver: bridge
